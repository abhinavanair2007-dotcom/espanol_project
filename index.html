<style>

:root[data-theme="dark"]{--bg:#141110;--card:#211c1a;--hd:#1b1715;--tx:#f3ebe3;--mu:#b0a398;--ac:#e0566b;--ok:#4cc38a;--bad:#ff7a6b;--bd:#3a312c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:var(--hd)}
h1,h2,h3,.brand{font-family:Georgia,"Times New Roman",serif;margin:.2em 0 .4em}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--hd);border-bottom:1px solid var(--bd)}
.bar1{display:flex;align-items:center;gap:8px;max-width:1000px;margin:auto;padding:8px 14px}
.brand{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;flex:1;margin:0}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1000px;margin:auto;padding:0 8px}
nav.tabs button{background:none;color:var(--mu);border:0;border-bottom:3px solid transparent;border-radius:0;padding:9px 12px;white-space:nowrap}
nav.tabs button.on{color:var(--ac);border-color:var(--ac)}
main{max-width:1000px;margin:auto;padding:16px 14px 48px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0}
button,.btn{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--ac);color:#fff;text-decoration:none;display:inline-block}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
.chip{padding:5px 12px;font-size:14px;margin:2px}.chip.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}
select{width:auto}
.mu{color:var(--mu)}.bad{color:var(--bad)}.center{text-align:center}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.heroBox{position:relative;border-radius:18px;overflow:hidden;color:#fff;min-height:190px;margin-top:6px}
.heroBox svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.heroBox .tx{position:relative;padding:26px 22px 60px;text-shadow:0 1px 6px rgba(0,0,0,.45);max-width:560px}
.heroBox h1{font-size:30px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--mu)}
.stats b{display:block;font-size:22px;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:14px}
.tile span{font-size:28px}.tile small{color:var(--mu);font-weight:400}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:13px;background:var(--ac)}
.pbar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0 14px}.pbar i{display:block;height:100%;background:var(--ok)}
.qhead{display:flex;justify-content:space-between}
.stem{font-size:21px;margin:.3em 0 .8em}
.opt{display:block;width:100%;text-align:left;margin:7px 0;background:var(--bg);color:var(--tx);border:2px solid var(--bd);padding:12px 14px}
.opt.sel{border-color:var(--ac)}.opt.right{border-color:var(--ok);background:rgba(43,138,87,.15)}.opt.wrong{border-color:var(--bad);background:rgba(192,57,43,.14)}
.slot{min-height:54px;border:2px dashed var(--bd);border-radius:12px;padding:6px;margin:8px 0}.bank{margin-bottom:12px}
.w{font-size:17px;padding:8px 14px}
.fb{border-radius:12px;padding:10px 14px;margin:12px 0;border:1px solid var(--bd)}.okb{border-color:var(--ok)}.nob{border-color:var(--bad)}.fb p{margin:.3em 0 0}
.tb{overflow-x:auto}.tb table{border-collapse:collapse;width:100%}.tb td,.tb th{border:1px solid var(--bd);padding:7px 11px;text-align:left}.tb th{background:var(--bd)}
.wk{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.wk .grow b{display:block}
.lvh{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
#chat{height:340px;overflow-y:auto;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--bg)}
.m{margin:6px 0;padding:9px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap}.m.u{background:var(--ac);color:#fff;margin-left:auto}.m.b{background:var(--card);border:1px solid var(--bd)}
.vc svg{width:100%;border-radius:10px;display:block;margin-bottom:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:20;display:none}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.heroBox h1{font-size:24px}}

function retry(){Z.mode=="place"?startPlace():startQuiz(Z.orig,Z.title,Z.mode,Z.lid)}
function qHTML(){const q=Z.qs[Z.i],s=Z.s,n=Z.qs.length;
 let b=`<div class="qhead"><span class="mu">${Z.ok}/${Z.i+(s.done?1:0)}</span><b>${Z.i+1}/${n}</b></div><div class="pbar"><i style="width:${Z.i/n*100}%"></i></div>`;
 if(q[0]=="m")b+=`<h3 class="stem">${esc(q[1])}</h3>`+s.opts.map((o,k)=>`<button class="opt ${s.done?(o.c?"right":k==s.sel?"wrong":""):(k==s.sel?"sel":"")}" onclick="selOpt(${k})">${esc(o.x)}</button>`).join("");
 if(q[0]=="f")b+=`<h3 class="stem">${esc(q[1])}</h3><input id="fin" placeholder="${t("type")}" value="${esc(s.val)}" oninput="Z.s.val=this.value" ${s.done?"disabled":""} onkeydown="if(event.key=='Enter')check()" autocomplete="off">`;
 if(q[0]=="o")b+=`<p class="mu">${t("build")}</p><h3 class="stem">${esc(q[1])}</h3><div class="slot">${s.pick.map(i=>`<button class="chip w" onclick="unW(${i})">${esc(s.pool[i].w)}</button>`).join("")}</div><div class="bank">${s.pool.map((p,i)=>p.u?"":`<button class="chip w sec" onclick="pushW(${i})">${esc(p.w)}</button>`).join("")}</div>`;
 if(s.done)b+=`<div class="fb ${s.ok?"okb":"nob"}"><b>${s.ok?t("ok"):t("no")}</b>${s.ok?"":` · ${t("ans")}: <b>${esc(answerOf(q))}</b>`}<p>${esc(s.tip+expl(q))}</p></div><button onclick="nextQ()">${Z.i+1<n?t("next"):t("fin")}</button>`;
 else b+=`<button onclick="check()">${t("check")}</button>`;
 return b}
function selOpt(k){if(!Z.s.done){Z.s.sel=k;vPractice()}}
function pushW(i){if(!Z.s.done){Z.s.pool[i].u=true;Z.s.pick.push(i);vPractice()}}
function unW(i){if(!Z.s.done){Z.s.pool[i].u=false;Z.s.pick=Z.s.pick.filter(x=>x!=i);vPractice()}}
function check(){const q=Z.qs[Z.i],s=Z.s;if(s.done)return;let ok=false;
 if(q[0]=="m"){if(s.sel<0)return;ok=s.opts[s.sel].c}
 else if(q[0]=="f"){if(!s.val.trim())return;ok=norm(s.val)==norm(q[2]);if(ok&&s.val.trim().toLowerCase()!=q[2].toLowerCase())s.tip="✔ "+q[2]+" — "}
 else{if(!s.pick.length)return;ok=norm(s.pick.map(i=>s.pool[i].w).join(" "))==norm(q[2])}
 s.done=true;s.ok=ok;if(ok){Z.ok++;gain(5);if(q.lv)Z.c[q.lv]=(Z.c[q.lv]||0)+1}else Z.mist.push(q);vPractice()}
function nextQ(){Z.i++;if(Z.i>=Z.qs.length)finishQ();else initQ();vPractice()}
function finishQ(){const n=Z.qs.length,pc=Math.round(Z.ok/n*100),u=U();Z.fin=true;
 if(Z.mode=="lesson")u.done[Z.lid]=Math.max(u.done[Z.lid]||0,pc);
 if(Z.mode=="place"){let l="A0";for(const x of LV){if((Z.c[x]||0)>=1)l=x;else break}u.level=l;u.sc.push({d:new Date().toLocaleDateString(),s:Z.ok,l})}
 if(pc==100)u.perfect=true;gain(Math.round(pc/10));save()}
function resHTML(){const n=Z.qs.length,pc=Math.round(Z.ok/n*100),u=U();
 return `<div class="card center">${mascot(90)}<h2>${t("score")}: ${Z.ok}/${n}</h2>${ring(pc,130)}${Z.mode=="place"?`<p><span class="pill" style="background:${COL[u.level]||"#777"}">${t("lvl")}: ${u.level}</span></p>`:""}<p><button onclick="retry()">${t("retry")}</button> <button class="g" onclick="go('${Z.mode=="place"?"home":"practice"}')">${Z.mode=="place"?t("path"):t("back")}</button></p></div>${Z.mist.length?`<div class="card"><h3>${t("rev")}</h3>${Z.mist.map(q=>`<div class="fb nob"><b>${esc(q[1])}</b><br>${t("ans")}: <b>${esc(answerOf(q))}</b><p>${esc(expl(q))}</p></div>`).join("")}</div>`:""}`}
function vPractice(){const m=$("#main"),u=U();
 if(Z){if(Z.fin){m.innerHTML=resHTML();return}m.innerHTML=`<div class="card"><p class="mu">${esc(Z.title)}</p>${qHTML()}</div>`;const f=$("#fin");if(f&&!Z.s.done)f.focus();return}
 m.innerHTML=`<div class="card row">${mascot(70)}<div class="grow"><h2>${t("place")}</h2><p class="mu">${t("placeD")}</p><button onclick="startPlace()">${t("start")}</button></div></div>
 <div class="card"><h3>${t("lessons")}</h3><div class="grid">${LS.map(s=>`<button class="tile" onclick="testLesson('${s.id}')"><span>${s.ic}</span><b>${ti(s)}</b><small>${s.lv}${u.done[s.id]!=null?" · "+u.done[s.id]+"%":""}</small></button>`).join("")}</div></div>
 <div class="card"><h3>✨ ${t("ai")}</h3><p class="mu">${t("aiD")}</p><input id="dt" placeholder="${t("topic")}"><select id="dl">${LV.map(l=>`<option>${l}</option>`).join("")}</select> <button id="dg" onclick="genDrill()">${t("gen")}</button></div>`}
async function genDrill(){const tp=$("#dt").value.trim()||"ser vs estar",lv=$("#dl").value,b=$("#dg");b.disabled=true;b.textContent=t("busy");
 try{const s=await claude.use("sample");if(!s)throw 0;
  const r=await s(`Create 6 Spanish grammar multiple-choice questions on "${tp}" at CEFR level ${lv}. One correct answer each, plausible distractors, blank written as ___. Explanations in ${LN[lang]}. Return ONLY a JSON array: [{"q":"...","o":["a","b","c"],"a":0,"e":"..."}]`,{cache:false});
  const a=JSON.parse(r.text.replace(/```json|```/g,"").trim());
  const qs=a.filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length>1&&Number.isInteger(x.a)&&x.o[x.a]!=null).map(x=>["m",String(x.q),x.o.map(o=>String(o).replace(/\|/g,"/")).join("|"),x.a,String(x.e||"")]);
  if(!qs.length)throw 0;startQuiz(qs,"✨ "+tp,"ai")}catch(e){b.disabled=false;b.textContent=t("gen");toast(t("fail"))}}
/* verbs */
const PR=["yo","tú","él/ella/usted","nosotros","vosotros","ellos/ustedes"],TS=["Presente","Pretérito","Imperfecto","Futuro","Condicional","Subjuntivo"],TN={Presente:"Present",Pretérito:"Preterite",Imperfecto:"Imperfect",Futuro:"Future",Condicional:"Conditional",Subjuntivo:"Subjunctive"};
const IRR={ser:{p:["soy","eres","es","somos","sois","son"],t:["fui","fuiste","fue","fuimos","fuisteis","fueron"]},estar:{p:["estoy","estás","está","estamos","estáis","están"],t:["estuve","estuviste","estuvo","estuvimos","estuvisteis","estuvieron"]},ir:{p:["voy","vas","va","vamos","vais","van"],t:["fui","fuiste","fue","fuimos","fuisteis","fueron"]},tener:{p:["tengo","tienes","tiene","tenemos","tenéis","tienen"],t:["tuve","tuviste","tuvo","tuvimos","tuvisteis","tuvieron"]},hacer:{p:["hago","haces","hace","hacemos","hacéis","hacen"],t:["hice","hiciste","hizo","hicimos","hicisteis","hicieron"]}};
const FS={tener:"tendr",hacer:"har",poder:"podr",querer:"querr",venir:"vendr",decir:"dir",saber:"sabr",salir:"saldr",poner:"pondr",haber:"habr"},IRL=["poder","querer","venir","decir","saber","salir","poner","dormir","pedir","jugar","volver","conocer","ver","dar","traer","oír","seguir","sentir","pensar","encontrar","empezar","haber"];
function conjugate(v,tn){v=v.trim().toLowerCase();if(!/^[a-záéíóúüñ]+(ar|er|ir)$/.test(v))return null;
 const e=v.slice(-2),st=v.slice(0,-2),ar=e=="ar",I=IRR[v];
 if(I&&tn=="Presente")return{f:I.p};if(I&&tn=="Pretérito")return{f:I.t};
 if(tn=="Futuro"||tn=="Condicional"){const S=FS[v]||v,x=tn=="Futuro"?["é","ás","á","emos","éis","án"]:["ía","ías","ía","íamos","íais","ían"];return{f:x.map(z=>S+z),w:IRL.includes(v)&&!FS[v]}}
 const E={Presente:ar?["o","as","a","amos","áis","an"]:e=="er"?["o","es","e","emos","éis","en"]:["o","es","e","imos","ís","en"],Pretérito:ar?["é","aste","ó","amos","asteis","aron"]:["í","iste","ió","imos","isteis","ieron"],Imperfecto:ar?["aba","abas","aba","ábamos","abais","aban"]:["ía","ías","ía","íamos","íais","ían"],Subjuntivo:ar?["e","es","e","emos","éis","en"]:["a","as","a","amos","áis","an"]};
 return{f:E[tn].map(z=>st+z),w:IRL.includes(v)||!!I}}
function vVerbs(){$("#main").innerHTML=`<div class="card"><h2>${t("verbs")}</h2><label>${t("inf")}</label><input id="cvi" value="${esc(cv)}" oninput="cv=this.value;conjOut()"><p>${["hablar","comer","vivir","ser","estar","ir","tener","hacer"].map(v=>`<button class="chip sec" onclick="cv='${v}';vVerbs()">${v}</button>`).join("")}</p><p>${TS.map(n=>`<button class="chip ${ct==n?"":"sec"}" onclick="ct='${n}';vVerbs()">${lang=="es"?n:n+" · "+TN[n]}</button>`).join("")}</p><div id="cout"></div></div>`;conjOut()}
function conjOut(){const r=conjugate(cv,ct);$("#cout").innerHTML=!r?`<p class="mu">-ar / -er / -ir</p>`:tbl([[cv.trim().toLowerCase(),ct],...r.f.map((f,i)=>[PR[i],f])])+(r.w?`<p class="mu">⚠ ${t("warn")}</p>`:"")}
/* tutor */
const MODES={ask:["❓ ","Answer the learner’s question about Spanish thoroughly and accurately: explain the rule, give 3 example sentences with translations, and mention common mistakes."],chat:["💬 ","Role-play a natural conversation in Spanish at the learner’s level. Keep replies to 2-3 short sentences, end with a question, and add a brief correction of any mistake under a line starting with ✏️."],fix:["✍️ ","The learner sends Spanish text. Return: 1) the corrected text, 2) a bullet list of each mistake with the rule, 3) one tip."]};
function vTutor(){$("#main").innerHTML=`<div class="card"><h2>🤖 ${t("tutor")}</h2><p>${Object.keys(MODES).map(k=>`<button class="chip ${mode==k?"":"sec"}" onclick="mode='${k}';hist=[];vTutor()">${MODES[k][0]}${t(k)}</button>`).join("")}</p><div id="chat"><div class="m b">${t("tg")}</div></div><div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="q" placeholder="${t("ph")}" style="margin:0" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">${t("send")}</button></div></div>`;hist.forEach(h=>add(h.r=="u"?"u":"b",h.c))}
function add(c,x){const d=document.createElement("div");d.className="m "+c;d.textContent=x;$("#chat").appendChild(d);$("#chat").scrollTop=1e9;return d}
async function ask(){const q=$("#q").value.trim();if(!q)return;$("#q").value="";add("u",q);hist.push({r:"u",c:q});const o=add("b",t("busy")),u=U();
 try{const s=await claude.use("sample");if(!s)throw 0;
  const sys="You are an expert, patient Spanish teacher in a language-learning app. Write explanations in "+LN[lang]+" (keep Spanish examples in Spanish; in conversation mode reply in Spanish with "+LN[lang]+" hints). Learner level: "+(u.level||"beginner")+"; goal: "+u.goal+". "+MODES[mode][1]+" Stay on topic and be accurate.";
  const r=await s(sys+"\n\nConversation:\n\n"+hist.slice(-10).map(h=>(h.r=="u"?"Learner: ":"Teacher: ")+h.c).join("\n\n")+"\n\nWrite the Teacher’s next reply only.",{cache:false,onText:x=>{o.textContent=x.text;$("#chat").scrollTop=1e9}});
  o.textContent=r.text;hist.push({r:"b",c:r.text});gain(3)}catch(e){o.textContent=t("fail")}}
/* videos */
const yt=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
const CH=["Dreaming Spanish","Butterfly Spanish","SpanishPod101","Easy Spanish","Profedeele","Spanish with Vicente"];
function vVideos(){const u=U();vlv=vlv||u.level||"A1";
 $("#main").innerHTML=`<div class="card"><h2>▶️ ${t("videos")}</h2><p class="mu">${t("vq")}</p><input id="vt" value="${esc(vtopic)}" placeholder="${esc(ti(LS[3]))}"><p>${LV.map(l=>`<button class="chip ${vlv==l?"":"sec"}" onclick="vtopic=$('#vt').value;vlv='${l}';vVideos()">${l}</button>`).join("")}</p><p>${LS.slice(0,8).map(s=>`<button class="chip sec" onclick="$('#vt').value=this.textContent">${esc(ti(s))}</button>`).join("")}</p><button id="vb" onclick="genVideos()">${t("vs")}</button><p class="mu">${t("ytNote")}</p></div><div id="vres">${vids?vidCards():""}</div>
 <div class="card"><h3>👩‍🏫 ${t("teach")}</h3><p><a class="btn" href="https://www.italki.com/en/teachers/spanish" target="_blank" rel="noopener">italki</a> <a class="btn" href="https://preply.com/en/online/spanish-tutors" target="_blank" rel="noopener">Preply</a> <a class="btn" href="https://www.verbling.com/spanish-teachers" target="_blank" rel="noopener">Verbling</a></p></div>`}
function vidCards(){return `<div class="grid">${vids.map((v,i)=>`<div class="card vc">${thumb(COL[LV[i%5]])}<b>${esc(v.title)}</b><p class="mu">${esc(v.channel)}<br>${esc(v.why||"")}</p><a class="btn chip" href="${yt(v.query)}" target="_blank" rel="noopener">▶ ${t("open")}</a></div>`).join("")}</div>`}
async function genVideos(){const tp=$("#vt").value.trim()||ti(LS[3]);vtopic=tp;const b=$("#vb");b.disabled=true;b.textContent=t("busy");
 try{const s=await claude.use("sample");if(!s)throw 0;
  const r=await s(`A Spanish learner at CEFR level ${vlv} wants videos about: "${tp}". Suggest 6 YouTube searches likely to surface excellent lessons from real, well-known Spanish-learning channels (e.g. ${CH.join(", ")}). Return ONLY a JSON array of 6 objects: {"title":"descriptive lesson title","channel":"channel name","query":"YouTube search query","why":"one sentence in ${LN[lang]} on why it helps"}`,{cache:false});
  const a=JSON.parse(r.text.replace(/```json|```/g,"").trim());
  vids=a.filter(x=>x&&x.title&&x.query).slice(0,6);if(!vids.length)throw 0}
 catch(e){toast(t("fail"));vids=CH.map(c=>({title:tp+" · "+vlv,channel:c,query:c+" "+tp+" "+vlv,why:""}))}
 vVideos()}
document.documentElement.lang=lang;load();render();
</script></body></html>
